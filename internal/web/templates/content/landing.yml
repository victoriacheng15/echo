header:
  project_name: "Echo"
  site_url: "https://victoriacheng15.github.io/echo"

llms:
  objective: "Echo is a high-precision MCP (Model Context Protocol) server that provides AI agents with a deterministic memory layer, integrating FTS5-backed contextual retrieval with embedded DuckDB analytics for knowledge ROI and resource observability."
  stack: "Go (Golang), SQLite (FTS5/WAL), MCP (Model Context Protocol), JSON-RPC 2.0, DuckDB"
  pattern: "Dual-Interface (MCP/CLI)"
  entry_point: "cmd/echo/main.go"
  persistence_strategy: "Local SQLite with automated FTS5 synchronization"
  observability: "On-demand FinOps & GreenOps telemetry via embedded DuckDB"

# Architecture Blueprint
architecture:
  diagram_ascii: |
    [AI Agent / IDE]             [Human / Terminal]
           │                             │
    (JSON-RPC 2.0 via STDIO)          (Flag Commands)
           ▼                             ▼
    ┌──────────────────────┐      ┌──────────────────────┐
    │ MCP Transport Layer  │      │    CLI Dispatcher    │
    └──────────┬───────────┘      └──────────┬───────────┘
               │                             │
         (Strong Types)                (Shared State)
               │                             │
               └─────────────┬───────────────┘
                             ▼
                ┌─────────────────────────┐
                │  Shared Service Layer   │
                └────────────┬────────────┘
                             │
                       (Validation)
                             ▼
                    ┌─────────────────┐
                    │ Storage Engine  │
                    └────────┬────────┘
                             │
     ┌───────────────────────┼───────────────────────┐
     ▼                       ▼                       ▼
    (WAL Persistence)      (Full-Text Search)      (Telemetry)
     ▼                       ▼                       ▼
    ┌──────────────────┐   ┌──────────────────┐    ┌──────────────────┐
    │  SQLite LTM DB   │   │ FTS5 Virtual Tab │    │ DuckDB Analytics │
    └──────────────────┘   └──────────────────┘    └──────────────────┘

# Core Components & Logic
tech:
  - title: "Interface & CLI Layer"
    description: "Implements fat binary routing, Smart TTY detection, and CLI subcommands to expose shared memory states directly to terminal users."
  - title: "MCP Transport Layer"
    description: "Handles Model Context Protocol registrations and maps incoming JSON-RPC 2.0 messages onto typed service boundaries."
  - title: "Memory Service"
    description: "Orchestrates retrieval and maintenance logic, routing queries between basic scans and the FTS5 virtual table."
  - title: "Persistence & Telemetry"
    description: "Manages local SQLite WAL storage, automated FTS5 index updates, and DuckDB analytical query runners."

# Validation & Resiliency Testing
proof:
  - title: "Reproducibility"
    description: "Development environment bootstrapping using Nix (shell.nix) and reproducible project builds via Makefile automation."
  - title: "Automated Verification"
    description: "Continuous validation verified via local Go benchmarking suite (make bench) and standard unit testing."
  - title: "Telemetry Pipeline"
    description: "Granular cost, latency, and knowledge ROI tracking compiled automatically with the embedded DuckDB query runner."

# Design Trade-offs & Verification Logs
reach:
  humble_pivots:
    - title: "FTS5 Virtual Table for Search"
      description: "Pivoted from basic SQL LIKE queries to SQLite FTS5 index for O(log n) keyword search performance on larger datasets."
    - title: "ID-based Deletion Confirmation"
      description: "Introduced surrogate ID confirmation workflows to prevent unintended mass-deletion of semantic context during agent updates."
  objective_clarity:
    description: "Deterministic, local memory server providing sub-millisecond context retrieval within standard resource budgets."
