header:
  project_name: "Echo"
  site_url: "https://victoriacheng15.github.io/echo"

system_specification:
  objective: "Echo is a high-precision MCP (Model Context Protocol) server that provides AI agents with a deterministic memory layer, integrating FTS5-backed contextual retrieval with autonomous DuckDB analytics for knowledge ROI and resource observability."
  stack: "Go (Golang), SQLite (FTS5/WAL), MCP (Model Context Protocol), JSON-RPC 2.0, DuckDB"
  pattern: "Dual-Interface (MCP/CLI)"
  entry_point: "cmd/echo/main.go"
  persistence_strategy: "Local SQLite with automated FTS5 synchronization"
  observability: "Autonomous FinOps & GreenOps Telemetry via embedded DuckDB"
  machine_registry: "/api/evolution-registry.json"

hero:
  headline: "Persistent Memory for Intelligent AI Agents"
  sub_headline: "Echo provides AI agents with persistent SQLite memory, accessible via both MCP and a terminal CLI."
  brief_description: "Echo is a high-precision memory layer that allows AI agents to store and recall context across sessions, featuring an MCP server for agents and a CLI for human curation."
  cta_text: "Explore on GitHub"
  cta_link: "https://github.com/victoriacheng15/echo"
  secondary_cta_text: "See Evolution"
  secondary_cta_link: "evolution.html"

what_is_echo:
  title: "The Brains Behind the AI"
  content:
    - "Echo provides an external long-term memory layer for AI agents, overcoming the limitations of stateless sessions."
    - "Instead of relying on the 'agent's mind,' memory tools are triggered to retrieve context, allowing the agent to process requests without the developer re-typing instructions."
    - "It supports two primary interfaces: an automated MCP server for AI tool calls and a terminal CLI for direct human curation of the memory state."
    - "The integrated DuckDB analytical engine tracks knowledge ROI and resource impact to ensure every interaction remains high-signal."

key_features:
  title: "Core Capabilities"
  features:
    - name: "MCP & CLI Access"
      description: "AI agents can interact with memories via MCP tools, while humans can curate the same state via the terminal."
      icon: "🔗"
    - name: "Store & Recall"
      description: "Save and retrieve information (code snippets, instructions, observations) with sub-millisecond latency."
      icon: "🧠"
    - name: "Search Memories"
      description: "Advanced contextual search using similarity (FTS5) to find relevant knowledge for the agent."
      icon: "🔍"
    - name: "Update & Delete"
      description: "Surgical refinement of existing knowledge with surrogate ID targeting for absolute precision."
      icon: "🛡️"
    - name: "Get Analytics"
      description: "Comprehensive resource observability, tracking cost-efficiency and environmental impact."
      icon: "📊"
    - name: "Search for Deletion"
      description: "Deterministic discovery protocol for surgical data governance and safety."
      icon: "🗑️"

why_it_matters:
  title: "Driving Smarter, More Capable AI"
  points:
    - "Enhanced Context: AI agents maintain deep understanding over extended interactions."
    - "Continuous Learning: Knowledge gained is persistent, improving agent performance over time."
    - "Reliable Persistence: Leverages SQLite for persistent, local data storage."
    - "Developer Experience: Simple JSON-RPC interface for easy integration into agent architectures."
    - "Future-Proof: Designed to scale with evolving AI agent requirements."

footer:
