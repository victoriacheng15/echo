header:
  project_name: "Echo"
  site_url: "https://victoriacheng15.github.io/echo"

system_specification:
  objective: "Echo is a high-precision MCP (Model Context Protocol) server that provides AI agents with a deterministic memory layer, integrating FTS5-backed contextual retrieval with embedded DuckDB analytics for knowledge ROI and resource observability."
  stack: "Go (Golang), SQLite (FTS5/WAL), MCP (Model Context Protocol), JSON-RPC 2.0, DuckDB"
  pattern: "Dual-Interface (MCP/CLI)"
  entry_point: "cmd/echo/main.go"
  persistence_strategy: "Local SQLite with automated FTS5 synchronization"
  observability: "On-demand FinOps & GreenOps telemetry via embedded DuckDB"
  machine_registry: "/api/evolution-registry.json"

hero:
  headline: "Persistent Memory for AI Agents"
  sub_headline: "A local SQLite memory layer for MCP tools and terminal workflows."
  brief_description: "Echo lets agents store, recall, search, and refine context across sessions while keeping memory inspectable from the CLI."
  cta_text: "Explore on GitHub"
  cta_link: "https://github.com/victoriacheng15/echo"
  secondary_cta_text: "See Evolution"
  secondary_cta_link: "evolution.html"

what_is_echo:
  title: "Memory Infrastructure for AI Agents"
  content:
    - "Echo provides an external long-term memory layer for AI agents, overcoming the limitations of stateless sessions."
    - "Instead of relying on repeated prompts, memory tools retrieve stored context so agents can process requests without the developer re-typing project instructions."
    - "It supports two primary interfaces: an automated MCP server for AI tool calls and a terminal CLI for direct human curation of the memory state."
    - "The integrated DuckDB analytical engine tracks knowledge ROI and resource impact so memory usage can be reviewed, refined, and kept high-signal."

key_features:
  title: "Core Capabilities"
  features:
    - name: "Shared MCP & CLI Access"
      description: "Agents and humans work with the same local memory state through MCP tools or terminal commands."
      icon: "🔗"
    - name: "Persistent Store & Recall"
      description: "Save instructions, facts, and artifacts, then recall them by context with benchmarked sub-millisecond local retrieval."
      icon: "🧠"
    - name: "FTS5 Search & Curation"
      description: "Find, update, and delete memories precisely with SQLite FTS5 search and ID-based governance."
      icon: "🔍"
    - name: "Usage Analytics"
      description: "Use embedded DuckDB telemetry to review knowledge ROI, cost-efficiency, and environmental impact."
      icon: "📊"

why_it_matters:
  title: "Driving Smarter, More Capable AI"
  points:
    - "Enhanced Context: AI agents can retrieve relevant context across extended interactions."
    - "Continuous Learning: Knowledge gained is persistent, improving agent performance over time."
    - "Reliable Persistence: Leverages SQLite for persistent, local data storage."
    - "Developer Experience: Simple JSON-RPC interface for easy integration into agent architectures."
    - "Local Control: Memory stays inspectable, editable, and portable through shared MCP and CLI workflows."

footer:
  author: "Victoria Cheng"
  github_link: "https://github.com/victoriacheng15"
