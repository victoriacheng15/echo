page_title: "Echo Evolution"
intro_text: "A timeline of the architecture decisions that shaped Echo’s local memory, retrieval, analytics, and agent interfaces."
chapters:
  - title: "Project Launch: Persistent Memory"
    intro: "Defining the core foundation of the project by building a resilient 'Long-Term Memory' from day one."
    timeline:
      - date: "2026-02-27"
        title: "Foundation: Persistent Memory Layer"
        artifacts:
          - name: "ADR 001: SQLite WAL Mode"
            url: "docs/decisions/001-sqlite-wal.md"
        description: |
          - Launched with a 'Local-First' persistence layer, ensuring AI agents retain critical context across sessions.
          - Utilized SQLite WAL to enable simultaneous data access and maintain a reliable state without data corruption.
  - title: "Optimization & Retrieval"
    intro: "Optimizing retrieval for fast local context lookup."
    timeline:
      - date: "2026-02-28"
        title: "Optimization: Hybrid Search Engine"
        artifacts:
          - name: "ADR 002: FTS5 Search Optimization"
            url: "docs/decisions/002-fts5-search.md"
        description: |
          - Delivered a '230x speedup' with sub-10ms retrieval, ensuring agents find relevant information as the knowledge base grows.
          - Reduced system overhead for local execution as the knowledge base grows.
  - title: "Project Workflow & Iteration"
    intro: "Building a living project through AI-human collaboration and real-time documentation."
    timeline:
      - date: "2026-03-01"
        title: "Launch: Interactive Project Showcase"
        description: |
          - Built a custom Go-based static generator through an iterative AI-human workflow, establishing a 'Living Documentation' system.
  - title: "Knowledge ROI & Unit Economics"
    intro: "Integrating an analytics framework to measure the cost and value of every interaction."
    timeline:
      - date: "2026-03-06"
        title: "Proposed: Zero-Config DuckDB Analytics"
        artifacts:
          - name: "ADR 003: DuckDB Analytics"
            url: "docs/decisions/003-duckdb-analytics.md"
        description: |
          - Proposed a high-fidelity telemetry system to track 'Cost-per-Project' and 'Carbon Footprint' using an embedded DuckDB OLAP layer.
          - Designed an analytical feedback loop to identify low-value context and support high-signal memory refinement.
      - date: "2026-03-07"
        title: "Implementation: DuckDB Analytical Bridge"
        artifacts:
          - name: "ADR 003: DuckDB Analytics"
            url: "docs/decisions/003-duckdb-analytics.md"
        description: |
          - Implemented the DuckDB-optimized Data Bridge to ingest high-fidelity JSONL telemetry, enabling sub-millisecond OLAP querying of system economics.
          - Engineered the Knowledge Refiner service to decay and deactivate low-signal memories based on measured hit rates.
      - date: "2026-03-08"
        title: "Observability: get_analytics Tooling"
        description: |
          - Exposed the DuckDB analytical engine through the MCP get_analytics tool, giving AI agents on-demand visibility into resource impact and context utility.
          - Completed the MCP-facing FinOps feedback loop by enabling agents to query cost-per-feature and carbon footprint metrics directly.
  - title: "Memory Precision & Data Integrity"
    intro: "Hardening the memory lifecycle against accidental data loss through deterministic surrogate ID targeting."
    timeline:
      - date: "2026-03-19"
        title: "Hardening: Surrogate ID-Based Deletion"
        artifacts:
          - name: "ADR 004: ID-Based Deletion"
            url: "docs/decisions/004-id-based-deletion.md"
        description: |
          - Eliminated content-collision failure modes by transitioning from natural keys to unique surrogate IDs for destructive operations.
          - Prevented accidental broad deletion by ensuring the AI agent can only target a specific record, even when identical content exists across contexts.
  - title: "User Options & Interface Expansion"
    intro: "Providing users with the choice between AI-driven MCP interactions and terminal-based human curation."
    timeline:
      - date: "2026-03-20"
        title: "Expansion: Standard Flag CLI"
        artifacts:
          - name: "ADR 005: CLI Expansion"
            url: "docs/decisions/005-cli-expansion.md"
        description: |
          - Established a Dual-Interface architecture that offers users the flexibility to interact with the SQLite 'Brain' through either the AI-driven MCP server or the terminal-based CLI.
